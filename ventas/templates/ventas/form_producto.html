{% extends 'ventas/base.html' %}
{% block content %}
<h2>{% if producto %}Editar{% else %}Nuevo{% endif %} Producto</h2>
<form method="POST">
    {% csrf_token %}
    <label>Código:</label><br>
    <input type="text" name="codigo" value="{{ producto.codigo }}" required><br><br>
    <label>Nombre:</label><br>
    <input type="text" name="nombre" value="{{ producto.nombre }}" required><br><br>
    <label>Cantidad en Stock:</label><br>
    <input type="number" name="cantidad" value="{{ producto.cantidad|default_if_none:'0' }}" required><br><br>
    <label>Precio:</label><br>
    <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" required><br><br>
    <button type="submit" class="btn">Guardar</button>
</form>
{% endblock %}
