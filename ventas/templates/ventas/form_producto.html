{% extends 'ventas/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4 text-primary">{% if producto %}✏️ Editar{% else %}➕ Nuevo{% endif %} Producto</h2>
        
        <form method="POST" class="needs-validation">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label fw-bold">Código:</label>
                <input type="text" name="codigo" class="form-control" value="{{ producto.codigo }}" placeholder="Ej: PROD-001" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre del Producto:</label>
                <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" placeholder="Ej: Manzanas" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Cantidad en Stock:</label>
                    <input type="number" name="cantidad" class="form-control" value="{{ producto.cantidad|default_if_none:'0' }}" min="0" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Precio Unitario:</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" min="0" required>
                    </div>
                </div>
            </div>
