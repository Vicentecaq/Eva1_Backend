{% extends 'ventas/base.html' %}
{% block content %}
<h2>Productos Disponibles</h2>
<a href="{% url 'crear_producto' %}" class="btn">Nuevo Producto</a><br><br>
<table>
<tr><th>Código</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
{% for p in productos %}
<tr>
<td>{{ p.codigo }}</td>
<td>{{ p.nombre }}</td>
<td>${{ p.precio }}</td>
<td>{{ p.cantidad }}</td>
<td>
<a href="{% url 'editar_producto' p.id %}" class="btn">Editar</a>
<a href="{% url 'eliminar_producto' p.id %}" class="btn" style="color:red;">Eliminar</a>
</td>
</tr>
{% endfor %}
</table>
{% endblock %}
