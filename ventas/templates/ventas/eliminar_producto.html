{% extends 'ventas/base.html' %}
{% block content %}
<h2>Eliminar Producto</h2>
<p>¿Estás seguro que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn" style="color:red;">Sí, Eliminar</button>
    <a href="{% url 'lista_productos' %}" class="btn">Cancelar</a>
</form>
{% endblock %}
